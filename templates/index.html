<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<title>Trail log</title>
	<style>
		body { font-family: sans-serif; max-width: 800px; margin: 0 auto; padding: 20px; }
        form { background: #f4f4f4; padding: 20px; border-radius: 5px; margin-bottom: 30px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input, .form-group textarea { width: 100%; padding: 8px; box-sizing: border-box; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #e2e2e2; }
	</style>
</head>
<body>

	<h1>登山記録アプリ</h1>
	<form action="/add" method="POST">
        <h2>新しい記録を追加</h2>
        <div class="form-group">
            <label for="date">日付</label>
            <input type="date" id="date" name="date" required>
        </div>
        <div class="form-group">
            <label for="mountain_name">山名</label>
            <input type="text" id="mountain_name" name="mountain_name" placeholder="例: 富士山" required>
        </div>
        <div class="form-group">
            <label for="weather">天気</label>
            <input type="text" id="weather" name="weather" placeholder="例: 晴れのち曇り">
        </div>
        <div class="form-group">
            <label for="duration">所要時間</label>
            <input type="text" id="duration" name="duration" placeholder="例: 5時間40分">
        </div>
        <div class="form-group">
            <label for="memo">その他メモ</label>
            <textarea id="memo" name="memo" rows="4" placeholder="ルートや感想など"></textarea>
        </div>
        <button type="submit" style="padding: 10px 20px; background-color: #28a745; color: white; border: none; border-radius: 3px; cursor: pointer;">記録する</button>
    </form>

    <hr>

    <h2>これまでの記録</h2>
    <table>
        <thead>
            <tr>
                <th>日付</th>
                <th>山名</th>
                <th>天気</th>
                <th>所要時間</th>
                <th>その他メモ</th>
            </tr>
        </thead>
        <tbody>
            {{range .}}
            <tr>
                <td>{{.Date}}</td>
                <td>{{.MountainName}}</td>
                <td>{{.Weather}}</td>
                <td>{{.Duration}}</td>
                <td>{{if .Memo}}{{.Memo}}{{else}}-{{end}}</td>
            </tr>
            {{else}}
            <tr>
                <td colspan="5" style="text-align: center;">まだ記録がありません。</td>
            </tr>
            {{end}}
        </tbody>
    </table>

</body>
</html>
